<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body { margin:0; padding:0; background:var(--rice-paper); color:var(--ink-black); font-family:var(--font-sans); }
  .card { padding: 28px 32px; min-height: 100%; box-sizing: border-box; display: flex; gap: 28px; align-items: center; flex-wrap: wrap; }

  .stamp-round {
    width: 110px; height: 110px; border-radius: 999px;
    border: 1.5px solid #553125;
    color: #553125;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 2px;
    font-family: 'Thermemo JP', serif; font-weight: 700; font-size: 38px; line-height: 1;
    transform: rotate(-6deg);
    box-shadow: inset 0 0 0 4px rgba(85,49,37,0.04);
  }
  .stamp-round .micro { font-family: 'Helvetica', sans-serif; font-size: 8px; letter-spacing: 0.32em; font-weight: 700; margin-top: 6px; }

  .stamp-pill {
    display: inline-flex; align-items: center; gap: 8px;
    border: 1px solid #553125; color: #553125;
    padding: 6px 14px; border-radius: 999px;
    font-size: 10px; letter-spacing: 0.22em; font-weight: 700; text-transform: uppercase;
  }
  .stamp-pill .dot { width: 5px; height: 5px; border-radius: 50%; background: #553125; }

  .stamp-rect {
    border: 1.5px solid #111; padding: 8px 14px;
    font-size: 10px; letter-spacing: 0.22em; font-weight: 700; text-transform: uppercase;
    transform: rotate(-3deg);
  }

  .stamp-square {
    width: 80px; height: 80px;
    background: #553125; color: #F7F4EE;
    display:flex; align-items:center; justify-content:center;
    font-family: 'Thermemo JP', serif; font-weight: 700; font-size: 38px;
  }
  .label { font-size: 9px; letter-spacing: 0.22em; text-transform: uppercase; opacity: 0.55; font-weight: 700; margin-top: 10px; display:block; text-align:center; }
  .unit { display:flex; flex-direction:column; align-items:center; }
</style>
</head>
<body>
<div class="card">
  <div class="unit"><div class="stamp-round">記<span class="micro">THERMEMO · 2026</span></div><span class="label">Round Seal</span></div>
  <div class="unit"><div class="stamp-square">片</div><span class="label">Block Seal</span></div>
  <div class="unit"><div class="stamp-rect">No. 0042</div><span class="label">Receipt Tag</span></div>
  <div class="unit"><div class="stamp-pill"><span class="dot"></span>Limited</div><span class="label">Pill Stamp</span></div>
</div>
</body>
</html>
