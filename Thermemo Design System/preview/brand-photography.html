<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body { margin:0; padding:0; background:var(--rice-paper); color:var(--ink-black); font-family:var(--font-sans); }
  .card { padding: 24px 32px; min-height: 100%; box-sizing: border-box; display:grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
  .frame { aspect-ratio: 2 / 5; background: linear-gradient(0deg, #2a2622, #6b655d); position: relative; overflow:hidden; border-left: 1px dashed rgba(17,17,17,0.3); border-right: 1px dashed rgba(17,17,17,0.3); }
  .frame::before, .frame::after { content:''; position:absolute; left:0; right:0; height: 6px; background: radial-gradient(circle at 4px 0, #F7F4EE 2.5px, transparent 3px) 0 0/10px 6px repeat-x; }
  .frame::before { top: -3px; transform: rotate(180deg); }
  .frame::after  { bottom: -3px; }
  .frame.mono { background: linear-gradient(160deg, #1a1714 0%, #4a4540 50%, #14110f 100%); }
  .frame.sepia { background: linear-gradient(160deg, #3a2a20 0%, #8a6e58 50%, #2c1f17 100%); filter: contrast(0.95); }
  .frame.contrast { background: linear-gradient(160deg, #050505 0%, #f0ece4 45%, #0a0a0a 100%); filter: contrast(1.15); }
  .cell { display:flex; flex-direction:column; gap: 8px; }
  .lab { font-size: 9px; letter-spacing: 0.22em; text-transform: uppercase; font-weight: 700; opacity: 0.7; }
  .note { font-size: 10.5px; opacity: 0.65; line-height: 1.35; }
</style>
</head>
<body>
<div class="card">
  <div class="cell"><div class="frame mono"></div><div class="lab">Monochrome</div><div class="note">Pure B&amp;W. Default photobooth output.</div></div>
  <div class="cell"><div class="frame sepia"></div><div class="lab">Warm Mono</div><div class="note">Sepia tint — nostalgic, warmer keepsake feel.</div></div>
  <div class="cell"><div class="frame contrast"></div><div class="lab">High Contrast</div><div class="note">Crushed blacks + paper highs. Editorial.</div></div>
</div>
</body>
</html>
