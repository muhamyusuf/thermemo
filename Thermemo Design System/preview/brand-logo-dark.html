<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body { margin:0; padding:0; background:var(--ink-black); color:var(--rice-paper); font-family:var(--font-sans); }
  .card { padding: 28px 32px; min-height: 100%; box-sizing: border-box; display:flex; align-items:center; gap: 36px; }
  .lockup { display:flex; flex-direction:column; gap: 8px; align-items:flex-start; }
  .word { font-family: 'Helvetica', sans-serif; font-weight: 700; font-size: 64px; letter-spacing: -0.025em; line-height: 1; }
  .tag  { font-family: 'Kaushan Script', cursive; font-size: 20px; color: #B8945F; line-height: 1; }
  .meta { display: flex; gap: 18px; }
  .meta div { font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; font-weight: 700; opacity: 0.65; }
  .img { width: 130px; }
  .img img { width: 100%; height: auto; filter: invert(1); display:block; }
</style>
</head>
<body>
<div class="card">
  <div class="img"><img src="../assets/logo-thermemo.png" alt="thermemo seal"/></div>
  <div class="lockup">
    <div class="word">thermemo</div>
    <div class="tag">proof that this moment happened.</div>
    <div class="meta">
      <div>Cover · Closing</div>
      <div>Dark mode</div>
    </div>
  </div>
</div>
</body>
</html>
