<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body { margin:0; padding:0; background:var(--rice-paper); color:var(--ink-black); font-family:var(--font-sans); }
  .card { padding: 28px 32px; min-height: 100%; box-sizing: border-box; }
  .grid { display:grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .swatch { display:flex; flex-direction:column; gap: 8px; }
  .swatch .chip { aspect-ratio: 1.4 / 1; border-radius: 4px; border: 1px solid rgba(17,17,17,0.08); }
  .swatch .name { font-weight: 600; font-size: 12px; }
  .swatch .hex { font-family: var(--font-mono); font-size: 10.5px; opacity: 0.55; }
  .swatch .use { font-size: 11px; opacity: 0.7; line-height: 1.35; }
  h4 { margin: 0 0 12px; font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; font-weight: 700; opacity: 0.6; }
</style>
</head>
<body>
<div class="card">
  <h4>Tonal extensions — use sparingly</h4>
  <div class="grid">
    <div class="swatch"><div class="chip" style="background:#EFEADF;"></div><div class="name">Rice Paper Deep</div><div class="hex">#EFEADF</div><div class="use">Card backs on Rice Paper slides.</div></div>
    <div class="swatch"><div class="chip" style="background:#2A2622;"></div><div class="name" style="color:#2A2622;">Ink Soft</div><div class="hex">#2A2622</div><div class="use">Secondary text on light backgrounds.</div></div>
    <div class="swatch"><div class="chip" style="background:#7A4A38;"></div><div class="name" style="color:#7A4A38;">Cedar Soft</div><div class="hex">#7A4A38</div><div class="use">Hover/active state of cedar links.</div></div>
    <div class="swatch"><div class="chip" style="background:#B8B2A9;"></div><div class="name" style="color:#6A6660;">Stone Mid</div><div class="hex">#B8B2A9</div><div class="use">Tertiary borders, disabled state.</div></div>
  </div>
</div>
</body>
</html>
