<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body { margin:0; padding:0; background:var(--rice-paper); color:var(--ink-black); font-family:var(--font-sans); }
  .card { padding: 26px 32px; min-height: 100%; box-sizing: border-box; display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
  .motif { display:flex; flex-direction:column; gap: 10px; align-items:flex-start; }
  .demo { width: 100%; height: 90px; border: 1px solid #DCD8D1; background: #fff; display:flex; align-items:center; justify-content:center; position: relative; overflow:hidden; padding: 12px; box-sizing: border-box; }
  .lab { font-size: 9.5px; letter-spacing: 0.22em; text-transform: uppercase; font-weight: 700; opacity: 0.6; }
  .note { font-size: 11px; opacity: 0.7; line-height: 1.4; }

  .perf { width: 100%; height: 8px; background: radial-gradient(circle at 6px 4px, #F7F4EE 3px, transparent 3.5px) 0 0/14px 8px repeat-x; border: 0; }
  .lines { display:flex; flex-direction:column; gap: 6px; width: 100%; }
  .lines div { height: 1px; background: #111; opacity: 0.6; }
  .lines .dashed { background: transparent; border-top: 1px dashed rgba(17,17,17,0.5); height: 0; }
  .seal-demo { font-family: 'Thermemo JP', serif; font-size: 40px; color:#553125; line-height: 1; }
  .grain { background: repeating-radial-gradient(circle at 30% 40%, rgba(17,17,17,0.08) 0 1px, transparent 1px 4px), #F7F4EE; }
  .neg { font-family: 'Helvetica', sans-serif; font-size: 14px; font-weight: 700; align-self: flex-start; }
</style>
</head>
<body>
<div class="card">
  <div class="motif">
    <div class="demo">
      <svg width="100%" height="100%" viewBox="0 0 280 70" preserveAspectRatio="none"><path d="M0,50 Q15,38 30,52 T60,48 T90,54 T120,46 T150,52 T180,48 T210,56 T240,46 T270,52 T280,50 L280,70 L0,70 Z" fill="#111"/></svg>
    </div>
    <div class="lab">Torn edge</div>
    <div class="note">Section breaks &amp; asset frames.</div>
  </div>
  <div class="motif">
    <div class="demo"><div class="seal-demo">記</div></div>
    <div class="lab">Seal / stamp</div>
    <div class="note">Corner watermark on every artifact.</div>
  </div>
  <div class="motif">
    <div class="demo"><div class="lines"><div></div><div></div><div class="dashed"></div><div></div><div></div></div></div>
    <div class="lab">Thin linework</div>
    <div class="note">1px Ink &amp; 0.5pt dashed dividers.</div>
  </div>
  <div class="motif">
    <div class="demo grain"></div>
    <div class="lab">Paper grain</div>
    <div class="note">≤ 8% opacity. Never heavy.</div>
  </div>
  <div class="motif">
    <div class="demo" style="background: linear-gradient(160deg, #1a1714 0%, #4a4540 50%, #14110f 100%);"></div>
    <div class="lab">Monochrome photo</div>
    <div class="note">B&amp;W, sepia or high-contrast. No color.</div>
  </div>
  <div class="motif">
    <div class="demo" style="justify-content: flex-start; align-items: flex-end;"><div class="neg">thermemo.</div></div>
    <div class="lab">Negative space</div>
    <div class="note">10% margins minimum. Air is the design.</div>
  </div>
</div>
</body>
</html>
