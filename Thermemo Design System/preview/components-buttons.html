<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body { margin:0; padding:0; background:var(--rice-paper); color:var(--ink-black); font-family:var(--font-sans); }
  .card { padding: 28px 32px; min-height: 100%; box-sizing: border-box; display:flex; flex-direction:column; gap: 20px; }
  .row { display:flex; gap: 16px; flex-wrap: wrap; align-items: center; }
  .btn { font-family: var(--font-sans); font-size: 13px; letter-spacing: 0.04em; padding: 10px 22px; border-radius: 2px; cursor: pointer; transition: all 200ms cubic-bezier(0.32, 0.72, 0, 1); font-weight: 600; }
  .btn-primary { background: #111; color: #F7F4EE; border: 1px solid #111; }
  .btn-primary:hover { background: #553125; border-color: #553125; }
  .btn-ghost { background: transparent; color: #111; border: 1px solid #111; }
  .btn-ghost:hover { background: #111; color: #F7F4EE; }
  .btn-text { background: transparent; color: #111; border: 0; border-bottom: 1px solid transparent; padding: 4px 0; border-radius: 0; }
  .btn-text:hover { border-bottom-color: #553125; color: #553125; }
  .btn-stamp { background: transparent; color: #553125; border: 1px solid #553125; padding: 6px 14px; border-radius: 999px; font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; font-weight: 700;}
  .btn-disabled { opacity: 0.35; pointer-events: none; }
  .label { font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; opacity: 0.55; font-weight: 700; display:block; margin-bottom: 8px; }
</style>
</head>
<body>
<div class="card">
  <div>
    <span class="label">Buttons</span>
    <div class="row">
      <button class="btn btn-primary">Book a booth</button>
      <button class="btn btn-ghost">Lihat sample</button>
      <button class="btn btn-text">read more →</button>
      <button class="btn btn-stamp">· stamped ·</button>
      <button class="btn btn-primary btn-disabled">Disabled</button>
    </div>
  </div>
  <div>
    <span class="label">States — hover · press · disabled</span>
    <div class="row" style="font-size: 12px; opacity: 0.75; line-height: 1.5;">
      Hover: cedar underline or full inversion · Press: scale 0.96 · Disabled: opacity 0.4 · Transition 200ms ease-out.
    </div>
  </div>
</div>
</body>
</html>
